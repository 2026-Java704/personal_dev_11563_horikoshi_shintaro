<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>CustomerInfo</title>
	<link rel="stylesheet" href="/css/loginStyle.css">
</head>

<body>
	<aside_left id="aside_left">
		<main>

			<br>
			<br>
			<h3>新規会員登録</h3>

			<form action="/register" method="post">
				<table class="noBorderTable">
					<tr>
						<th>名前</th>
						<td>
							<input type="text" name="name" th:value="${name}">
						</td>
					</tr>
					<tr>
						<th>メールアドレス</th>
						<td>
							<input type="text" name="email" th:value="${email}">
						</td>
					</tr>
					<tr>
						<th>パスワード</th>
						<td>
							<input type="password" name="password">
						</td>
					</tr>
					<tr>
						<th>パスワード確認</th>
						<td>
							<input type="password" name="passwordConfirm">
						</td>
					</tr>
				</table>
				<br>
				<br>
				<button>登録</button>
			</form>

			<div th:if="${errors}">
				<br>
				<div th:each="error:${errors}">
					[[${error}]]
				</div>
				<br>
			</div>

			<a href="/login" class="whiteCircle">
				<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 12 12">
					<title xmlns="">arrow-left-12-filled</title>
					<path fill="currentColor"
						d="M10.5 6a.75.75 0 0 0-.75-.75H3.81l1.97-1.97a.75.75 0 0 0-1.06-1.06L1.47 5.47a.75.75 0 0 0 0 1.06l3.25 3.25a.75.75 0 0 0 1.06-1.06L3.81 6.75h5.94A.75.75 0 0 0 10.5 6" />
				</svg>
			</a>
		</main>
	</aside_left>

	<aside_right style="position: relative;">

		<svg class="mainImage" xmlns="http://www.w3.org/2000/svg" width="24em" height="24em" viewBox="0 0 24 24">
			<title xmlns="">round-account-circle</title>
			<path fill="white"
				d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2m0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6m0 14c-2.03 0-4.43-.82-6.14-2.88a9.95 9.95 0 0 1 12.28 0C16.43 19.18 14.03 20 12 20" />
		</svg>

	</aside_right>
</body>

</html>
