<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>項目作成</title>
</head>
<body>
	<form action="/items/add" method="post">
		<table border="1">
			<tr>
				<th>日付</th>
				<td>
					<input type="date" name="addDate">
				</td>
			</tr>
			<tr>
				<th>名前</th>
				<td>
					<input type="text" name="itemName">
				</td>
			</tr>
			<tr>
				<th>ジャンル</th>
				<td>
					<select name = "genreId">
						<option th:each="genre:${genres}" th:value="${genre.id}">[[${genre.genreName}]]</option>
					</select>
				</td>
			</tr>
			<tr>
				<th>値段</th>
				<td>
					<input type="number" name="price">
				</td>
			</tr>
			<tr>
				<th>コメント</th>
				<td>
					<textarea name="comment"></textarea>
				</td>
			</tr>
		</table>
		<button>登録</button>
	</form>
</body>
</html>
